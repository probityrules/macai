tasks:
  - title: AgentController cancelled and max-iterations tests
    description: |
      Extend tests/AgentController.test.ts with TWO new tests. Keep the existing
      investigation-mode success test intact.

      FIRST read_file src/agent/AgentController.ts (look at the loop around
      shouldStop and maxIterations) and tests/AgentController.test.ts.

      Test 1 — cancelled: pass shouldStop: () => true on the context. Expect
      result.success === false and /cancelled/i.test(result.failureReason).

      Test 2 — max-iterations: set limits.maxIterations: 2 in createTestAppConfig
      and supply 10 chatResponses. Expect result.success === false and
      /max iterations/i.test(result.failureReason).

      DO NOT add a coding-mode success test. Coding mode runs real git/npm in
      the worktree and will fail under a mock LLM.

      Pattern:
        const repo = createTempGitRepo();
        const db = openTempDatabase(repo.repoPath);
        const { taskId } = seedMinimalRun(db, repo.repoPath);
        db.updateTask(taskId, { mode: 'investigation' });
        const logDir = path.join(repo.repoPath, 'logs');
        fs.mkdirSync(logDir, { recursive: true });
        afterEach: db.close(); removeTempGitRepo(repo);

      Use createMockOllama, createTestAppConfig. Do NOT edit helpers.
      Run npm test before committing.
    mode: coding
    priority: 10

  - title: ContextManager checkpoint round-trip tests
    description: |
      Add tests/ContextManager.test.ts.
      FIRST read_file src/agent/ContextManager.ts — match the REAL method names
      (saveCheckpoint, loadFromCheckpoint, addDecision, addFileExamined,
      addFileChanged, incrementIteration, getIteration, setPriorHandoff,
      getPriorHandoff, setPhase, setPlan).

      Cover:
      1. saveCheckpoint persists; loadFromCheckpoint restores (use a real
         sqlite via openTempDatabase(repo.repoPath) + seedMinimalRun).
      2. addFileExamined / addFileChanged do not duplicate the same path.
      3. incrementIteration / getIteration round-trip.
      4. setPriorHandoff / getPriorHandoff round-trip.

      Pattern: createTempGitRepo, openTempDatabase(repo.repoPath),
      seedMinimalRun, db.close() + removeTempGitRepo in afterEach.
      Do NOT edit helpers. Run npm test before committing.
    mode: coding
    priority: 9

  - title: OllamaClient retry and error-handling tests
    description: |
      FIRST read_file src/ollama/OllamaClient.ts AND tests/OllamaClient.test.ts
      (it already exists). Extend it, do not replace it.

      Cover, using in-test fetch stubs (not a live Ollama, not createMockOllama):
      1. healthCheck on an unreachable URL (use 127.0.0.1:1 or a closed port)
         returns { ok: false }.
      2. chat with a successful JSON body parsed into { message: { content } }.
      3. If the class has a retry loop, verify it eventually succeeds after
         a 500 then a 200 (use a tiny local http.Server on a random port).

      Do not rewrite existing tests. Do NOT edit helpers. Run npm test
      before committing.
    mode: coding
    priority: 8
