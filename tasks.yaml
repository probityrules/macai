tasks:
  - title: Add TestTools and ToolRegistry unit tests
    description: |
      Add tests/TestTools.test.ts and/or tests/ToolRegistry.test.ts.
      FIRST read_file src/tools/TestTools.ts, src/tools/ToolRegistry.ts, and
      tests/FileTools.test.ts for the pattern of creating tools + executing by name.

      Prefer small, focused tests:
      - TestTools: run_tests uses config.repo.test (temp dir with a trivial
        package.json "test" script that exits 0, or follow existing ShellGuard patterns)
      - ToolRegistry: construct with createTestAppConfig + temp worktree context;
        execute a known tool by name; unknown tool returns JSON error

      Use createTempGitRepo / openTempDatabase from ./helpers/tempMacaiRepo if needed.
      Do NOT edit tests/helpers/*.ts (writes are blocked).
      Prefer write_file for whole new test files. Call run_tests after edits.
      No git_commit in work phase. Run npm test before committing.
    mode: coding
    priority: 10

  - title: Add WorktreeManager edge-case tests
    description: |
      Extend tests/WorktreeManager.test.ts (create if missing, else extend).
      FIRST read_file src/git/WorktreeManager.ts and any existing WorktreeManager tests.
      ALSO read_file tests/helpers/tempMacaiRepo.ts — createTempGitRepo is SYNC
      (not async) and returns { tmpDir, repoPath, cleanup }. Use removeTempGitRepo(repo)
      or repo.cleanup(). Do NOT use execa or invent async createTempGitRepo.

      Cover:
      1. createWorktree / removeWorktree round-trip — match real method signatures
         from WorktreeManager.ts exactly
      2. getCurrentBranch / isWorkingTreeClean on clean and dirty trees
      3. getWorktreeStatus for a missing path (match real API — throw or structured error)

      Do NOT edit helpers. Prefer write_file for the full test file.
      Run npm test before committing.
    mode: coding
    priority: 9

  - title: Investigation — remaining highest-ROI coverage gaps
    description: |
      After the coding tasks above, investigate what still has the worst
      coverage among JobManager, src/cli/*, and AgentController coding-mode
      paths. Produce a short investigation report with concrete next-task
      recommendations (3–5 bullets). Do not modify production code.
      Use read/search tools only.
    mode: investigation
    priority: 7

  - title: Verify suite after tool-coverage tasks
    description: |
      Run npm test. If green, complete without inventing new files.
      Only fix real failures introduced by prior tasks in this run.
      Do not create noop verification tests. Do not edit tests/helpers/*.ts.
    mode: testing
    priority: 6
