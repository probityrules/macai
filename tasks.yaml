tasks:
  - title: Expand FileTools coverage for edit/list/path edges
    description: |
      Extend tests/FileTools.test.ts (do not rewrite from scratch).
      FIRST read_file src/tools/FileTools.ts and tests/FileTools.test.ts.

      Add tests covering currently weak paths:
      1. write_file creates a new file and overwrites an existing one
      2. edit_file replaces a unique string; returns an error when old_string
         is missing or not unique
      3. list_directory returns entries for an existing dir and errors for
         a missing path
      4. Path traversal (../): ShellGuard.validatePath THROWS ShellGuardError —
         assert with expect(tool.execute(...)).rejects.toThrow(/traversal/i).
         Do NOT expect a JSON { error } return for path traversal (unlike
         read-only mode, which returns JSON).
      5. read-only mode: write_file and edit_file return JSON errors when
         ctx.readOnly is true

      Follow the existing FileTools.test.ts pattern (tmpDir, AppConfigSchema,
      createFileTools, ShellGuard). After a failed test cycle, call run_tests
      before more edit_file loops. Do NOT edit helpers.
      Run npm test before committing.
    mode: coding
    priority: 10

  - title: Add TestTools and ToolRegistry unit tests
    description: |
      Add tests/TestTools.test.ts and/or extend coverage for ToolRegistry.
      FIRST read_file src/tools/TestTools.ts and src/tools/ToolRegistry.ts.

      Prefer small, focused tests:
      - TestTools: run_tests invokes the configured repo.test command (use a
        temp dir with a trivial package.json script, or stub ShellGuard run
        if the existing pattern does that)
      - ToolRegistry: register tools, execute a known tool by name, reject
        unknown tools, and respect readOnly / retry budgets at a high level

      Use createTempGitRepo or a plain tmpDir as appropriate.
      Do NOT invent helpers. Do NOT edit tests/helpers/*.ts.
      Run npm test before committing.
    mode: coding
    priority: 9

  - title: Add WorktreeManager edge-case tests
    description: |
      Extend tests/WorktreeManager.test.ts (create if missing, else extend).
      FIRST read_file src/git/WorktreeManager.ts and any existing WorktreeManager tests.

      Cover:
      1. createWorktree / removeWorktree round-trip on a temp git repo
      2. getCurrentBranch / isWorkingTreeClean on a clean and dirty tree
      3. getWorktreeStatus for a path that does not exist (expect a thrown
         error or a structured failure — match the real API)

      Use createTempGitRepo + removeTempGitRepo. Do NOT edit helpers.
      Run npm test before committing.
    mode: coding
    priority: 8

  - title: Investigation — remaining highest-ROI coverage gaps
    description: |
      After the coding tasks above, investigate what still has the worst
      coverage among JobManager, src/cli/*, and AgentController coding-mode
      paths. Produce a short investigation report with concrete next-task
      recommendations (3–5 bullets). Do not modify production code.
      Use read/search tools only.
    mode: investigation
    priority: 7

  - title: Verify suite after tool-coverage tasks
    description: |
      Run npm test. If green, complete without inventing new files.
      Only fix real failures introduced by prior tasks in this run.
      Do not create noop verification tests.
    mode: testing
    priority: 6
