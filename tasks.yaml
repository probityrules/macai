tasks:
  - title: AgentController cancelled and max-iterations tests
    description: |
      Extend tests/AgentController.test.ts with TWO new tests. Keep the existing
      investigation-mode success test intact.

      FIRST read_file src/agent/AgentController.ts around shouldStop and
      maxIterations (lines ~100-110), then read_file tests/AgentController.test.ts.

      Test 1 — cancelled:
        Pass shouldStop: () => true on AgentRunContext.
        Expect result.success === false and result.failureReason === 'Cancelled'.

      Test 2 — max-iterations:
        IMPORTANT: set limits.maxIterations: 0 in createTestAppConfig.
        Iteration starts at 0, so 0 >= 0 fires immediately at the top of the loop.
        Do NOT use maxIterations: 2 — investigation mode finishes before hitting it.
        Expect result.success === false and result.failureReason === 'Max iterations exceeded'.

      DO NOT add a coding-mode success test.

      Pattern:
        const repo = createTempGitRepo();
        const db = openTempDatabase(repo.repoPath);
        const { taskId } = seedMinimalRun(db, repo.repoPath);
        db.updateTask(taskId, { mode: 'investigation' });
        const logDir = path.join(repo.repoPath, 'logs');
        fs.mkdirSync(logDir, { recursive: true });
        afterEach: db.close(); removeTempGitRepo(repo);

      Use createMockOllama, createTestAppConfig({ limits: { maxIterations: 0 } }).
      Do NOT edit helpers. Run npm test before committing.
    mode: coding
    priority: 10
